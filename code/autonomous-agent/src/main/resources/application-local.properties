# ---------------------------------------------------------------------------
# Local development profile: run the agent WITHOUT an AgentCore Memory resource.
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# This disables the AgentCore Memory auto-configuration so the app starts with no
# AGENTCORE_MEMORY_ID. The agent is fully functional but stateless (no cross-turn
# conversation memory). You still need AWS credentials and Bedrock model access for
# the model calls themselves.
# ---------------------------------------------------------------------------
spring.autoconfigure.exclude=\
  org.springaicommunity.agentcore.memory.shortterm.AgentCoreShortTermMemoryRepositoryAutoConfiguration,\
  org.springaicommunity.agentcore.memory.longterm.AgentCoreLongTermMemoryAutoConfiguration,\
  org.springaicommunity.agentcore.browser.AgentCoreBrowserAutoConfiguration,\
  org.springaicommunity.agentcore.codeinterpreter.AgentCoreCodeInterpreterAutoConfiguration

# Allow the browser dev server to call the API directly if you bypass the Vite proxy.
agent.cors-allowed-origins=http://localhost:5173,http://localhost:4173

# The managed AgentCore Browser and Code Interpreter tools need their AWS managed
# services provisioned. Disable them locally so the agent answers (including writing
# and reasoning through pandas/data-analysis code) without depending on those services.
agent.managed-tools-enabled=false
