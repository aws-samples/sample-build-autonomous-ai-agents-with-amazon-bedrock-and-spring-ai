spring.application.name=autonomous-agent

# ---------------------------------------------------------------------------
# Amazon Bedrock (Converse API)
# Region and credentials are resolved by the default AWS SDK chain
# (environment variables, ~/.aws/credentials, or the runtime IAM role).
# ---------------------------------------------------------------------------
spring.ai.bedrock.aws.region=${AWS_REGION:us-east-1}
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_MODEL:global.anthropic.claude-sonnet-4-5-20250929-v1:0}
spring.ai.bedrock.converse.chat.options.temperature=${MODEL_TEMPERATURE:0.3}

# ---------------------------------------------------------------------------
# AgentCore Memory
# Create a memory resource first (see scripts/create-memory.sh) and export its
# id as AGENTCORE_MEMORY_ID. Long-term auto-discovery picks up whatever
# strategies the memory resource has configured.
# ---------------------------------------------------------------------------
# Without a memory id, run with the "stateless" (or "local") profile; Terraform
# adds "stateless" automatically when memory_id is empty.
agentcore.memory.memory-id=${AGENTCORE_MEMORY_ID:}
agentcore.memory.short-term.total-events-limit=${MEMORY_EVENTS_LIMIT:100}
agentcore.memory.short-term.page-size=50
agentcore.memory.long-term.auto-discovery=true

# ---------------------------------------------------------------------------
# AgentCore Browser tools (browseUrl, takeScreenshot, clickElement, fillForm,
# evaluateScript). mode=agentcore uses the managed AgentCore Browser service;
# mode=local launches a local headless Chromium (requires Playwright browsers:
# run `mvn -q exec:java -e -Dexec.mainClass=...` or `npx playwright install chromium`).
# ---------------------------------------------------------------------------
agentcore.browser.mode=${BROWSER_MODE:agentcore}
agentcore.browser.max-content-length=${BROWSER_MAX_CONTENT:10000}
agentcore.browser.screenshot-ttl-seconds=300

# ---------------------------------------------------------------------------
# AgentCore Code Interpreter tool (executeCode). Runs Python/JavaScript/TypeScript
# in a managed sandbox and returns generated files (charts, CSVs) automatically.
# ---------------------------------------------------------------------------
agentcore.code-interpreter.session-timeout-seconds=900
agentcore.code-interpreter.file-store-ttl-seconds=300

# ---------------------------------------------------------------------------
# AgentCore Evaluations. Opt-in online scoring of responses through the Bedrock
# AgentCore Evaluate API. Disabled by default so local runs make no extra calls.
# Enable with EVALUATION_ENABLED=true and set the evaluator ids you have access to.
# ---------------------------------------------------------------------------
spring.ai.agentcore.evaluations.enabled=${EVALUATION_ENABLED:false}
spring.ai.agentcore.evaluations.evaluator-ids=${EVALUATION_EVALUATOR_IDS:Builtin.Helpfulness}
spring.ai.agentcore.evaluations.async=true
spring.ai.agentcore.evaluations.sample-rate=${EVALUATION_SAMPLE_RATE:1.0}
spring.ai.agentcore.evaluations.metrics-enabled=true
spring.ai.agentcore.evaluations.region=${AWS_REGION:us-east-1}

# ---------------------------------------------------------------------------
# Agent behavior (externalized per twelve-factor config -> AgentProperties)
# ---------------------------------------------------------------------------
agent.response-timeout=${RESPONSE_TIMEOUT:60s}
# agent.system-prompt can override the default role/behavior prompt.
# CORS origins allowed to call /api/** (the React UI). Lock down in production.
agent.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------------------
# AgentCore Runtime starter
# Port 8080 is required by the AgentCore Runtime contract.
# Rate limiting is opt-in: it activates only when limits are set.
# ---------------------------------------------------------------------------
server.port=8080
agentcore.throttle.invocations-limit=${INVOCATIONS_LIMIT:60}
agentcore.throttle.ping-limit=${PING_LIMIT:240}

# Graceful shutdown so in-flight turns drain on scale-down.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ---------------------------------------------------------------------------
# Observability: Actuator health + Micrometer metrics + Prometheus scrape.
# Structured JSON logs to stdout (Spring Boot 3.4+ native) for CloudWatch.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
logging.structured.format.console=${LOG_FORMAT:}

# Distributed tracing (Micrometer -> OpenTelemetry -> OTLP). Off by default (sampling 0.0)
# so local runs export nothing. In production set TRACING_SAMPLING (e.g. 0.1) and point
# OTLP_TRACES_ENDPOINT at your OTel/ADOT collector, which forwards to AWS X-Ray.
management.tracing.sampling.probability=${TRACING_SAMPLING:0.0}
management.otlp.tracing.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.enabled=${TRACING_ENABLED:true}

logging.level.org.springaicommunity.agentcore=INFO
logging.level.com.amazonaws.samples.agentcore.autonomous=INFO

# ---------------------------------------------------------------------------
# Optional: AgentCore Gateway (MCP) for enterprise tools.
# Uncomment the spring-ai-starter-mcp-client dependency in pom.xml, then set:
# spring.ai.mcp.client.toolcallback.enabled=true
# spring.ai.mcp.client.initialized=false
# spring.ai.mcp.client.streamable-http.connections.gateway.url=${GATEWAY_URL}
# ---------------------------------------------------------------------------
