server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # config.js is generated per environment, so never cache it.
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }
}
