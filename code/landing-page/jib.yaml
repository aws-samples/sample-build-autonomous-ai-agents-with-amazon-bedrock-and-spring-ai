# Docker-free image build with Jib CLI (equivalent to the Dockerfile serve stage).
# Run `npm run build` first, then from this folder:
#   jib build --build-file=jib.yaml --target=<registry>/<repo>:<tag>
apiVersion: jib/v1alpha1
kind: BuildFile

from:
  image: docker.io/nginxinc/nginx-unprivileged:1.30-alpine
  platforms:
    - architecture: arm64
      os: linux

creationTime: ${CREATION_TIME}

exposedPorts:
  - "8080"

user: "101"
entrypoint: ["/docker-entrypoint.sh"]
cmd: ["nginx", "-g", "daemon off;"]

layers:
  entries:
    - name: nginx-config
      files:
        - src: nginx.conf
          dest: /etc/nginx/conf.d/default.conf
    - name: entrypoint-script
      properties:
        filePermissions: "755"
      files:
        - src: docker-entrypoint.d/40-landing-config.sh
          dest: /docker-entrypoint.d/40-landing-config.sh
    # Owned by nginx (101): the entrypoint script rewrites config.js at start-up.
    - name: static-site
      properties:
        user: "101"
        group: "101"
      files:
        - src: dist
          dest: /usr/share/nginx/html
