# ---------------------------------------------------------------------------
# "stateless" profile: run WITHOUT an AgentCore Memory resource.
#
# The AgentCore Memory starters fail at start-up when no memory id is set, so
# this profile switches off only their auto-configuration. Terraform adds this
# profile automatically when memory_id is empty:
#   SPRING_PROFILES_ACTIVE=dev,stateless
# ---------------------------------------------------------------------------
spring:
  autoconfigure:
    exclude:
      - org.springaicommunity.agentcore.memory.shortterm.AgentCoreShortTermMemoryRepositoryAutoConfiguration
      - org.springaicommunity.agentcore.memory.longterm.AgentCoreLongTermMemoryAutoConfiguration
