spring:
  application:
    name: idp-agent
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:15MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}
  ai:
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
      converse:
        chat:
          options:
            # Multimodal model so the agent can read image/PDF documents directly
            model: ${BEDROCK_MODEL:global.anthropic.claude-sonnet-4-5-20250929-v1:0}
            temperature: ${MODEL_TEMPERATURE:0.1}
            # Headroom so structured-output JSON is never truncated mid-document
            max-tokens: ${MODEL_MAX_TOKENS:4096}
  # Graceful shutdown so in-flight processing drains on scale-down
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

# ---------------------------------------------------------------------------
# AgentCore Memory (optional). When AGENTCORE_MEMORY_ID is unset the app still
# starts; agents simply run without cross-document session memory.
# ---------------------------------------------------------------------------
agentcore:
  memory:
    memory-id: ${AGENTCORE_MEMORY_ID:}
    short-term:
      total-events-limit: ${MEMORY_EVENTS_LIMIT:50}
    long-term:
      auto-discovery: ${MEMORY_LTM_AUTODISCOVERY:false}
  throttle:
    invocations-limit: ${INVOCATIONS_LIMIT:60}
    ping-limit: ${PING_LIMIT:240}

# ---------------------------------------------------------------------------
# Observability: Actuator + Micrometer + Prometheus; structured JSON logs.
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: idp-agent
  # Distributed tracing (Micrometer -> OpenTelemetry -> OTLP). Off by default (sampling 0.0)
  # so local runs export nothing. In production set TRACING_SAMPLING (e.g. 0.1) and point
  # OTLP_TRACES_ENDPOINT at your OTel/ADOT collector, which forwards to AWS X-Ray.
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  level:
    org.springaicommunity.agentcore: INFO
    com.amazonaws.samples.agentcore.idp: INFO

# CORS origins allowed to call /api/** (the React UI) are configured together with
# the workflow rules under the single `idp:` key below.

# ---------------------------------------------------------------------------
# Intelligent workflow rules. Add or change rules here, no code change needed.
# condition is a SpEL expression evaluated against the extraction:
#   documentType, confidence, validationIssues, fields['name'],
#   field('name')  -> case-insensitive value or "",  missing('name') -> boolean
# severity: INFO | WARN | ALERT (sends alert) | BLOCK (alert + hold for review)
# agentType: ALL or LAWYER | MORTGAGE | INSURANCE | TAX | GENERAL
# ---------------------------------------------------------------------------
idp:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Human-in-the-loop review. Documents that are blocked, carry an actionable alert, or
  # come back below the confidence threshold are routed to the review queue
  # (GET /api/review, POST /api/review/{id}/resolve).
  review:
    enabled: ${REVIEW_ENABLED:true}
    confidence-threshold: ${REVIEW_CONFIDENCE_THRESHOLD:0.7}
    max-queue-size: ${REVIEW_MAX_QUEUE_SIZE:500}
  rules:
    - id: legal-unsigned
      description: A legal document should be signed by all parties
      agentType: LAWYER
      condition: "field('signaturePresent') == 'false' || missing('signaturePresent')"
      severity: ALERT
      message: "Document appears unsigned, get all parties to sign before relying on it."

    - id: legal-high-risk
      description: High-risk legal terms need attorney review
      agentType: LAWYER
      condition: "field('riskLevel') == 'HIGH'"
      severity: ALERT
      message: "High-risk clauses detected, a licensed attorney should review this."

    - id: mortgage-missing-income
      description: Income must be documented for underwriting
      agentType: MORTGAGE
      condition: "field('incomeDocumented') == 'false' || missing('incomeDocumented')"
      severity: ALERT
      message: "Income documentation missing, request pay stubs, tax returns, or bank statements."

    - id: mortgage-high-dti
      description: Debt-to-income ratio above 0.43 is a red flag
      agentType: MORTGAGE
      condition: "field('dtiRatio') != '' && T(java.lang.Double).parseDouble(field('dtiRatio')) > 0.43"
      severity: WARN
      message: "Debt-to-income ratio exceeds 0.43, likely needs manual underwriting."

    - id: insurance-coverage-gap
      description: Inadequate coverage should be flagged
      agentType: INSURANCE
      condition: "field('coverageAdequate') == 'false'"
      severity: ALERT
      message: "Coverage gap detected, review limits and exclusions with the client."

    - id: insurance-claim-risk
      description: High claim-denial risk warrants a closer look
      agentType: INSURANCE
      condition: "field('claimDenialRisk') == 'HIGH'"
      severity: WARN
      message: "High claim-denial risk, verify covered perils and documentation."

    - id: tax-incomplete
      description: Tax filing is missing required figures
      agentType: TAX
      condition: "field('filingComplete') == 'false' || missing('filingComplete')"
      severity: WARN
      message: "Tax document is incomplete, gather the missing figures before filing."

    - id: low-confidence
      description: Low overall extraction confidence on any document
      agentType: ALL
      condition: "confidence < 0.6"
      severity: WARN
      message: "Low extraction confidence, consider human verification."
