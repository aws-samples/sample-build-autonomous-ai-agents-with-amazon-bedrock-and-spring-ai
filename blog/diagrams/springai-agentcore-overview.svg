<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="Amazon Ember, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a Spring AI agent works inside Amazon Bedrock AgentCore Runtime</title>
  <desc id="d">A caller invokes AgentCore Runtime, which routes the request by session to an isolated microVM running the Spring Boot agent container. The Spring AI AgentCore runtime starter serves /invocations and /ping, calls the @AgentCoreInvocation method, which runs guardrails and resilience around a Spring AI ChatClient. The ChatClient uses memory advisors, local tools, and AgentCore Browser and Code Interpreter tool callbacks, and calls Amazon Bedrock through the Converse API.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/></marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#01A88D"/></marker>
    <style>
      .h { font-size: 14px; font-weight: 700; fill: #232F3E; }
      .t { font-size: 12px; fill: #232F3E; }
      .s { font-size: 11px; fill: #545B64; }
      .mono { font-family: Consolas, Menlo, monospace; font-size: 12px; fill: #232F3E; }
      .w { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .n { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .box { fill: #ffffff; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1400" height="800" fill="#F7F9FB"/>

  <!-- Caller -->
  <rect x="24" y="300" width="170" height="96" rx="10" class="box" stroke="#232F3E"/>
  <text x="109" y="330" text-anchor="middle" class="h">Caller</text>
  <text x="109" y="350" text-anchor="middle" class="s">AWS CLI / SDK / app</text>
  <text x="109" y="366" text-anchor="middle" class="s">InvokeAgentRuntime</text>
  <text x="109" y="382" text-anchor="middle" class="s">+ session id (33+ chars)</text>

  <!-- AgentCore Runtime -->
  <rect x="226" y="60" width="872" height="700" rx="8" fill="#EFFAF7" stroke="#01A88D" stroke-width="2"/>
  <text x="244" y="86" font-size="15" font-weight="700" fill="#017A66">Amazon Bedrock AgentCore Runtime</text>
  <text x="244" y="104" class="s">Authenticates the caller, keeps one isolated microVM per session, forwards the request, watches health.</text>

  <!-- Runtime front door -->
  <rect x="244" y="250" width="170" height="196" rx="8" class="box" stroke="#01A88D"/>
  <text x="329" y="276" text-anchor="middle" class="h">Runtime service</text>
  <text x="329" y="300" text-anchor="middle" class="s">1. check IAM / JWT</text>
  <text x="329" y="318" text-anchor="middle" class="s">2. find or start the</text>
  <text x="329" y="332" text-anchor="middle" class="s">session's microVM</text>
  <text x="329" y="352" text-anchor="middle" class="s">3. add session header</text>
  <text x="329" y="372" text-anchor="middle" class="s">4. forward to :8080</text>
  <text x="329" y="392" text-anchor="middle" class="s">5. poll GET /ping</text>
  <text x="329" y="412" text-anchor="middle" class="s">(idle 15 min, max 8 h)</text>

  <line x1="194" y1="348" x2="242" y2="348" stroke="#232F3E" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- microVM / container -->
  <rect x="446" y="124" width="636" height="616" rx="8" fill="#ffffff" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="462" y="146" class="h">microVM for one session: the agent container</text>
  <text x="462" y="163" class="s">Spring Boot 4.1 · Java 21 · ARM64 · port 8080 · image from Amazon ECR</text>

  <!-- Layer 1: runtime starter -->
  <rect x="462" y="178" width="604" height="104" rx="8" fill="#E8F4FD" stroke="#147EBA" stroke-width="1.5"/>
  <text x="478" y="200" class="h">spring-ai-agentcore-runtime-starter</text>
  <text x="900" y="200" class="s">no controller code needed</text>
  <rect x="478" y="212" width="186" height="58" rx="6" class="box" stroke="#147EBA"/>
  <text x="571" y="234" text-anchor="middle" class="mono">POST /invocations</text>
  <text x="571" y="254" text-anchor="middle" class="s">JSON, or SSE for Flux</text>
  <rect x="674" y="212" width="196" height="58" rx="6" class="box" stroke="#147EBA"/>
  <text x="772" y="234" text-anchor="middle" class="mono">GET /ping</text>
  <text x="772" y="252" text-anchor="middle" class="s">Healthy / HealthyBusy</text>
  <text x="772" y="265" text-anchor="middle" class="s">polled by the runtime</text>
  <rect x="880" y="212" width="172" height="58" rx="6" class="box" stroke="#147EBA"/>
  <text x="966" y="234" text-anchor="middle" class="t">rate limiting</text>
  <text x="966" y="254" text-anchor="middle" class="s">agentcore.throttle.*</text>

  <line x1="414" y1="300" x2="476" y2="244" stroke="#01A88D" stroke-width="2.5" marker-end="url(#aTeal)"/>

  <!-- Layer 2: invocation method -->
  <rect x="462" y="298" width="604" height="70" rx="8" fill="#FFF8F1" stroke="#ED7100" stroke-width="1.5"/>
  <text x="478" y="321" class="mono">@AgentCoreInvocation</text>
  <text x="478" y="341" class="mono">Flux&lt;String&gt; invoke(PromptRequest, AgentCoreContext)</text>
  <text x="478" y="359" class="s">your code · AgentCoreContext gives the session id header</text>
  <line x1="571" y1="270" x2="571" y2="296" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/>

  <!-- Layer 3: service -->
  <rect x="462" y="384" width="604" height="70" rx="8" fill="#FFF8F1" stroke="#ED7100" stroke-width="1.5"/>
  <text x="478" y="406" class="h">AgentService</text>
  <rect x="600" y="394" width="210" height="50" rx="6" class="box" stroke="#ED7100"/>
  <text x="705" y="415" text-anchor="middle" class="t">GuardrailService</text>
  <text x="705" y="432" text-anchor="middle" class="s">blocks unsafe prompts first</text>
  <rect x="820" y="394" width="232" height="50" rx="6" class="box" stroke="#ED7100"/>
  <text x="936" y="415" text-anchor="middle" class="t">Resilience4j</text>
  <text x="936" y="432" text-anchor="middle" class="s">retry · circuit breaker · timeout</text>
  <line x1="571" y1="368" x2="571" y2="382" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/>

  <!-- Layer 4: Spring AI ChatClient -->
  <rect x="462" y="470" width="604" height="254" rx="8" fill="#F4F0FF" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="478" y="493" class="h">Spring AI ChatClient</text>
  <text x="680" y="493" class="s">the agent loop: model decides, tools run, results go back</text>
  <line x1="571" y1="454" x2="571" y2="476" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/>

  <rect x="478" y="506" width="280" height="62" rx="6" class="box" stroke="#8C4FFF"/>
  <text x="492" y="527" class="t">Memory advisors (optional)</text>
  <text x="492" y="545" class="s">agentCoreMemory.advisors</text>
  <text x="492" y="560" class="s">conversation id = actor:session</text>

  <rect x="772" y="506" width="280" height="62" rx="6" class="box" stroke="#8C4FFF"/>
  <text x="786" y="527" class="t">Local tools (@Tool)</text>
  <text x="786" y="545" class="s">TravelTools: weather, flights, sights</text>
  <text x="786" y="560" class="s">DateTimeTools · run inside the container</text>

  <rect x="478" y="580" width="280" height="62" rx="6" class="box" stroke="#8C4FFF"/>
  <text x="492" y="601" class="t">Browser tool callbacks</text>
  <text x="492" y="619" class="s">browserToolCallbackProvider</text>
  <text x="492" y="634" class="s">browse, screenshot, click, fill</text>

  <rect x="772" y="580" width="280" height="62" rx="6" class="box" stroke="#8C4FFF"/>
  <text x="786" y="601" class="t">Code Interpreter tool callbacks</text>
  <text x="786" y="619" class="s">codeInterpreterToolCallbackProvider</text>
  <text x="786" y="634" class="s">run Python, return files and charts</text>

  <rect x="478" y="654" width="574" height="56" rx="6" class="box" stroke="#8C4FFF"/>
  <text x="492" y="676" class="t">ChatModel: spring-ai-starter-model-bedrock-converse</text>
  <text x="492" y="694" class="s">sends prompt + tool definitions to Bedrock, executes the tool calls it returns, repeats until done</text>

  <!-- AWS services column -->
  <text x="1124" y="140" class="h">AWS services</text>
  <text x="1124" y="156" class="s">called with the runtime's IAM role</text>

  <rect x="1120" y="490" width="256" height="70" rx="8" class="box" stroke="#01A88D" stroke-dasharray="6 4"/>
  <text x="1136" y="514" class="h">AgentCore Memory</text>
  <text x="1136" y="533" class="s">CreateEvent / ListEvents</text>
  <text x="1136" y="549" class="s">RetrieveMemoryRecords</text>

  <rect x="1120" y="574" width="256" height="62" rx="8" class="box" stroke="#01A88D"/>
  <text x="1136" y="598" class="h">AgentCore Browser</text>
  <text x="1136" y="617" class="s">StartBrowserSession · CDP stream</text>

  <rect x="1120" y="404" width="256" height="72" rx="8" class="box" stroke="#01A88D"/>
  <text x="1136" y="428" class="h">AgentCore Code Interpreter</text>
  <text x="1136" y="447" class="s">StartCodeInterpreterSession</text>
  <text x="1136" y="463" class="s">InvokeCodeInterpreter</text>

  <rect x="1120" y="650" width="256" height="72" rx="8" class="box" stroke="#01A88D"/>
  <rect x="1120" y="650" width="8" height="72" fill="#01A88D"/>
  <text x="1140" y="674" class="h">Amazon Bedrock</text>
  <text x="1140" y="693" class="s">Converse / ConverseStream</text>
  <text x="1140" y="709" class="s">Claude Sonnet 4.5 (global)</text>

  <rect x="1120" y="168" width="256" height="92" rx="8" class="box" stroke="#E7157B"/>
  <text x="1136" y="192" class="h">Amazon CloudWatch</text>
  <text x="1136" y="211" class="s">stdout logs to the runtime log group</text>
  <text x="1136" y="227" class="s">runtime metrics + traces (OTel)</text>
  <text x="1136" y="243" class="s">sessions, latency, errors</text>

  <!-- arrows to services -->
  <!-- ChatClient (right edge x=1066) to each service -->
  <line x1="1066" y1="528" x2="1118" y2="525" stroke="#01A88D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#aTeal)"/>
  <line x1="1066" y1="600" x2="1118" y2="604" stroke="#01A88D" stroke-width="2" marker-end="url(#aTeal)"/>
  <line x1="1066" y1="590" x2="1118" y2="446" stroke="#01A88D" stroke-width="2" marker-end="url(#aTeal)"/>
  <line x1="1066" y1="682" x2="1118" y2="686" stroke="#01A88D" stroke-width="2.5" marker-end="url(#aTeal)"/>
  <line x1="1082" y1="178" x2="1118" y2="200" stroke="#E7157B" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="1066" y1="178" x2="1082" y2="178" stroke="#E7157B" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Response note -->
  <rect x="244" y="470" width="170" height="160" rx="8" class="box" stroke="#232F3E"/>
  <text x="329" y="494" text-anchor="middle" class="h">Response</text>
  <text x="329" y="516" text-anchor="middle" class="s">travel agent: text/event-</text>
  <text x="329" y="530" text-anchor="middle" class="s">stream chunks (SSE)</text>
  <text x="329" y="552" text-anchor="middle" class="s">IDP agent: one JSON</text>
  <text x="329" y="566" text-anchor="middle" class="s">document with fields,</text>
  <text x="329" y="580" text-anchor="middle" class="s">alerts, review status</text>
  <text x="329" y="604" text-anchor="middle" class="s">back to the caller</text>
  <text x="329" y="618" text-anchor="middle" class="s">through the runtime</text>
</svg>
